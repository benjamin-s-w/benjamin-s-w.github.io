name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate SEO metadata
        # Fails on a missing or duplicated title, description, or canonical,
        # more than one h1, unparseable JSON-LD, or a page absent from the sitemap.
        run: npm run validate:meta

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is required so root-relative hrefs like "/about/"
          # resolve against dist/ instead of the filesystem root.
          # 999 is LinkedIn, which blocks automated requests by design.
          args: >-
            --no-progress
            --include-fragments
            --root-dir "$GITHUB_WORKSPACE/dist"
            --accept 200,206,999
            --exclude-path dist/404.html
            'dist/**/*.html'
          fail: true

      - name: Lighthouse CI
        # Asserts a perfect SEO score and a perfect accessibility score.
        # The build fails if either regresses.
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
